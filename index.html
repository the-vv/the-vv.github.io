<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Construction</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e90ff, #00ced1);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: rgba(79, 172, 254, 0.3);
            border-radius: 50%;
            z-index: 0;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #0078d7;
        }

        p {
            font-size: 1rem;
            margin-bottom: 2rem;
            color: #555;
        }

        a {
            text-decoration: none;
            color: #0078d7;
            font-weight: bold;
            border: 2px solid #0078d7;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
        }

        a:hover {
            background: #0078d7;
            color: white;
        }

        .image {
            margin-bottom: 1.5rem;
        }

        .image img {
            max-width: 50%;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="image">
                <img src="https://diodisha.nic.in/images/page_under_construction.gif" alt="Under Construction">
            </div>
            <h1>Website Under Construction</h1>
            <p>I am currently working on building a new personal website. Stay tuned for updates!</p>
            <a href="/old.html">Visit Existing Website</a>
        </div>
    </div>
</body>

</html>
